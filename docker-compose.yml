version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - JWT_SECRET=${JWT_SECRET:-ai-incident-triage-secret-key-change-in-production}
    networks:
      - incident-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: incident-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - incident-net

networks:
  incident-net:
    driver: bridge
