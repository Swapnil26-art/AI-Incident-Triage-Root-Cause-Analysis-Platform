# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=ai-incident-triage

# Active Profile (default: dev with H2)
spring.profiles.active=dev

# --- H2 Database (Development) ---
spring.datasource.url=jdbc:h2:mem:incidentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- TiDB (Production) ---
# Uncomment and set these when deploying to production:
# spring.datasource.url=jdbc:mysql://your-tidb-cluster.tidbcloud.com:4000/incidentdb?useSSL=true&requireSecureTransport=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=your-tidb-username
# spring.datasource.password=your-tidb-password

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET:ai-incident-triage-secret-key-change-in-production-2024}
jwt.expiration=86400000

# CORS Configuration
app.cors.allowed-origins=https://ai-incident-triage-root-cause-analy.vercel.app,https://ai-incident-triage-root-caus-git-c6a56b-swapnil26-arts-projects.vercel.app,http://localhost:5173,http://localhost:3000,http://localhost:80

# WebSocket
spring.messaging.simp.allowed-origins=http://localhost:5173,http://localhost:3000
